name: PRONO70 V17
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: prono70
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Calcul des pronostics
        id: run
        run: python scripts/ia.py
        continue-on-error: true
        timeout-minutes: 12
      - name: Enregistrer les donnees (meme si le calcul a echoue : le message d'erreur est publie)
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/
          git commit -m "data: mise a jour automatique" || exit 0
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
      - name: Signaler l'echec du calcul
        if: steps.run.outcome == 'failure'
        run: exit 1
