name: PRONO70 V17
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: prono70
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/ia.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/
          git commit -m "data [skip ci]" || exit 0
          git pull --rebase
          git push
