name: PRONO70 V9 LIVE

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'  # Tourne toutes les 15 min pour le LIVE
    - cron: '0 6 * * *'      # Tourne à 6h pour les pronos du jour

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install
        run: pip install requests

      - name: Run IA V9
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python ia.py

      - name: Commit
        run: |
          git config --global user.name "Prono70-Bot"
          git config --global user.email "bot@prono70.com"
          git add data/matches.json
          git commit -m "V9 LIVE update $(date)" || echo "No changes"
          git push
