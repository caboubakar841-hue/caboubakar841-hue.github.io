name: PRONO70 V14.1 REAL
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python scripts/ia.py
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data/matches.json
          git commit -m "V14.1 real ESPN" || exit 0
          git push
