name: PRONO70 V14.3 REAL
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/matches.json'
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

concurrency:
  group: prono70
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python scripts/ia.py
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data/matches.json
          git commit -m "V14.3 real [skip ci]" || exit 0
          git push
