name: PRONO70 V12 REAL
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python scripts/ia.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "V12 REAL" && git push)
