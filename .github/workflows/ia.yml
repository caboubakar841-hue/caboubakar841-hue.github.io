name: PRONO70 VRAIE IA
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python scripts/ia.py
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - run: |
          git config --global user.name "IA"
          git config --global user.email "ia@prono70.com"
          git add data/matches.json
          git commit -m "update" || true
          git push
