name: PRONO70 VRAIE IA
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python scripts/ia.py
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - run: |
          git config user.name "PRONO70 IA"
          git config user.email "ia@prono70.com"
          git add data/matches.json
          git commit -m "IA Update $(date)" || echo "no change"
          git push
