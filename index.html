<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRONO70 V17</title>
<style>
body{background:#0f1115;color:#e0e0e0;font-family:Arial,sans-serif;margin:0;padding:10px}
.header{background:#161a22;padding:12px;border-radius:12px;text-align:center;margin-bottom:12px;border:1px solid #00ff88}
.header h1{color:#00ff88;margin:0;font-size:18px}.header p{margin:4px 0 0;font-size:11px;color:#aaa}
.filters{display:flex;gap:6px;margin-bottom:12px;justify-content:center;flex-wrap:wrap}
.filters button{padding:8px 12px;border-radius:20px;border:none;background:#222;color:#aaa;font-weight:bold}
.filters button.active{background:#00ff88;color:#000}
.card{background:#1a1e29;border:1px solid #2a2f3f;border-left:4px solid #00ff88;border-radius:12px;padding:10px;margin-bottom:10px}
.card.live{border-left-color:#f00;box-shadow:0 0 12px rgba(255,0,0,.3)}
.card.finished{border-left-color:#667}
.top{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:6px}
.conf{background:#00ff88;color:#000;padding:2px 8px;border-radius:10px;font-weight:bold}
.score{display:flex;align-items:center;justify-content:center;gap:10px;background:#11131a;border-radius:10px;padding:8px;margin-bottom:8px}
.score .t{flex:1;font-size:13px;font-weight:bold;color:#fff}.score .t:first-child{text-align:right}
.score .n{font-size:26px;font-weight:900;color:#fff;white-space:nowrap}
.live .n{color:#ff2a2a}.min{font-size:11px;font-weight:bold;color:#fff;background:#f00;border-radius:10px;padding:2px 8px;animation:b 1s infinite}
.fin .min{background:#445;animation:none}
@keyframes b{50%{opacity:.35}}
h3{margin:6px 0;font-size:15px;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.box{background:#222738;border-radius:8px;padding:6px;text-align:center;font-size:11px;color:#aaa}
.box b{display:block;color:#00ff88;font-size:12px;margin-top:2px}
.analyse{font-size:10px;color:#777;background:#11131a;padding:6px;border-radius:6px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:8px;border-bottom:1px solid #2a2f3f}td+td{text-align:right;font-weight:bold;color:#00ff88}
</style>
</head>
<body>
<div class="header"><h1>PRONO70 V17 • Modèle de Poisson</h1><p id="dateInfo">Chargement...</p></div>
<div class="filters">
<button id="b-today" class="active" onclick="show('today')">À venir (<span id="c-today">0</span>)</button>
<button id="b-live" onclick="show('live')">🔴 LIVE (<span id="c-live">0</span>)</button>
<button id="b-finished" onclick="show('finished')">Terminés (<span id="c-finished">0</span>)</button>
<button id="b-stats" onclick="show('stats')">Stats</button>
<button id="b-tickets" onclick="show('tickets')">🎟️ Tickets</button>
</div>
<div id="list"></div>
<script>
let D={matches:[],stats:{}},cur='today';
async function load(){
  try{
    D=await (await fetch('data/matches.json?v='+Date.now())).json();
    document.getElementById('dateInfo').innerText=D.date+' • '+D.matches.length+' cartes • mise à jour auto';
    ['today','live','finished'].forEach(s=>document.getElementById('c-'+s).innerText=D.matches.filter(m=>m.status===s).length);
    render();
  }catch(e){document.getElementById('list').innerHTML='<p style="text-align:center;color:#f55">Erreur de chargement de data/matches.json</p>'}
}
function show(c){cur=c;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+c).classList.add('active');render()}
function card(m){
  const sc=m.live_score?m.live_score.split('-'):null;
  const big=sc?'<div class="score"><span class="t">'+m.home+'</span><span class="n">'+sc[0]+' - '+sc[1]+'</span><span class="t">'+m.away+'</span></div>'+(m.minute?'<div style="text-align:center;margin-bottom:8px"><span class="min">'+(m.status==='live'?'🔴 ':'')+m.minute+'</span></div>':''):'';
  return '<div class="card '+m.status+(m.status==='finished'?' fin':'')+'"><div class="top"><span>'+m.league+'</span><span class="conf">'+m.conf+'%</span></div>'+big+(sc?'':'<h3>'+m.home+' vs '+m.away+'</h3>')+
  '<div class="grid"><div class="box">Victoire<b>'+m.victoire+'</b></div><div class="box">Score probable<b style="color:#fc0">'+m.score_exact+'</b></div><div class="box">Double chance<b>'+m.double_chance+'</b></div><div class="box">Corners<b>'+m.corner+'</b></div><div class="box">Over/Under<b>'+m.over+'</b></div><div class="box">BTTS<b>'+m.btts+'</b></div></div>'+(m.contexte?'<div class="analyse">🧭 '+m.contexte+'</div>':'')+'<div class="analyse">'+m.analyse+'</div></div>';
}
function tk(d){return d.tickets.map(t=>{
 const odds=t.legs.reduce((a,l)=>a*100/l.p,1);
 return '<div class="card"><div class="top"><span>'+d.day+' • '+t.name+'</span><span class="conf">'+t.status+'</span></div>'+
 (t.n<t.target?'<div class="analyse">Seulement '+t.n+' sélection(s) ('+t.rule+') disponibles aujourd\'hui (cible '+t.target+'). Rien n\'a été ajouté hors de cette zone.</div>':'')+
 t.legs.map(l=>'<div class="box" style="text-align:left;margin-top:6px">'+l.time+' UTC • '+l.match+'<b>'+(l.ok===true?'✅ ':l.ok===false?'❌ ':'')+l.pick+' — '+l.p+'% • cote est. '+(100/l.p).toFixed(2)+(l.score?' (score '+l.score+')':'')+'</b></div>').join('')+
 '<div class="analyse">Cote totale estimée : <b>'+(t.n?odds.toFixed(1):'-')+'</b> • chance que TOUT passe : environ '+(t.combined==null?'-':t.combined+' %')+'. Ces cotes sont estimées par le modèle (1 / probabilité). Les vraies cotes du bookmaker sont plus basses : compare toujours avant de jouer.</div></div>'}).join('')}
function render(){
  const el=document.getElementById('list');
  if(cur==='tickets'){const T=D.tickets||[];el.innerHTML=T.length?T.map(tk).join(''):'<p style="text-align:center">Pas encore de tickets.</p>';return}
  if(cur==='stats'){
    const s=D.stats||{};
    if(!s.n){el.innerHTML='<p style="text-align:center">Pas encore de matchs terminés à évaluer.</p>';return}
    const r=[['Matchs évalués',s.n],['dont figés avant le match',s.n_avant],['Victoire (favori net)',s['1x2']+'% ('+s.n_fav+')'],['Match serré : Nul ou X',(s.serre==null?'-':s.serre+'%')+' ('+s.n_serre+')'],['Référence : « toujours domicile »',s.base_dom+'%'],['Double chance',s.dc+'%'],['Over/Under 2.5',s.over+'%'],['BTTS',s.btts+'%'],['Score exact',s.score+'%']].concat(s.n_ctx?[['Avec / sans contexte (Brier)',s.brier_ctx+' / '+s.brier_base+' ('+s.n_ctx+')']]:[]);
    el.innerHTML='<div class="card"><table>'+r.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join('')+'</table><div class="analyse">Si « Victoire/Nul/Défaite » ne dépasse pas nettement la référence, le modèle n\'apporte rien. Attendre au moins 100 matchs avant de conclure. Brier : plus bas = mieux ; si « avec contexte » n\'est pas plus bas que « sans » après 50 matchs, le contexte n\'aide pas.</div></div>';
    return;
  }
  const f=D.matches.filter(m=>m.status===cur);
  el.innerHTML=f.map(card).join('')||'<p style="text-align:center;margin-top:20px">Aucun match dans cette section</p>';
}
load();setInterval(load,60000);
</script>
</body>
</html>
