<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRONO70 - IA Football</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white font-sans">
<div class="max-w-lg mx-auto p-4">
<h1 class="text-3xl font-black text-center mt-3">PRONO<span class="text-[#00ff88]">70</span></h1>
<p id="date" class="text-center text-zinc-500 text-sm mb-5"></p>
<div id="matches" class="space-y-3"></div>
</div>

<script>
async function load(){
 const r = await fetch('./data/matches.json?t='+Date.now());
 const data = await r.json();
 document.getElementById('date').innerText = `IA Football • ${data.date} • ${data.count} pronos • Auto à 6h`;
 document.getElementById('matches').innerHTML = data.matches.map(m=>`
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2">
      <span class="text-[11px] text-zinc-500 uppercase">${m.league}</span>
      <span class="bg-[#00ff88] text-black text-xs font-bold px-2 py-0.5 rounded-full">${m.conf}% CONF</span>
    </div>
    <div class="font-bold text-lg flex justify-between"><span>${m.home}</span><span class="text-zinc-600">vs</span><span>${m.away}</span></div>
    <div class="grid grid-cols-3 gap-2 mt-3">
      <div class="bg-black rounded-xl p-2 text-center"><div class="text-[10px] text-zinc-500">CORNERS</div><div class="font-bold text-[#00ff88] text-sm">${m.corner}</div><div class="text-[10px] text-zinc-400">${m.cornerM} moy</div></div>
      <div class="bg-black rounded-xl p-2 text-center"><div class="text-[10px] text-zinc-500">BUTS</div><div class="font-bold text-sm">${m.over}</div></div>
      <div class="bg-black rounded-xl p-2 text-center"><div class="text-[10px] text-zinc-500">BTTS</div><div class="font-bold text-sm">${m.btts}</div></div>
    </div>
    <div class="mt-2 text-xs text-zinc-400 bg-zinc-950 p-2 rounded-lg">${m.analyse}</div>
  </div>
 `).join('');
}
load();
</script>
</body>
</html>
