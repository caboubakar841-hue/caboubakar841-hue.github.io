<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial,sans-serif}
body{background:#070707;color:#fff}
.hero{text-align:center;padding:50px 15px 20px;background:radial-gradient(circle at 50% 0%,#1e3a0a,#070707 70%)}
.big{font-size:clamp(60px,18vw,140px);line-height:.85;letter-spacing:-4px}
.big span{color:#a3ff12}
.sub{font-family:Arial;font-size:13px;font-weight:700;color:#888;margin-top:12px;letter-spacing:2px}
.live{background:#a3ff12;color:#000;padding:12px 22px;border-radius:100px;display:inline-block;margin-top:20px;font-size:15px;font-weight:900}
.filters{display:flex;gap:8px;overflow-x:auto;padding:15px;max-width:1000px;margin:0 auto}
.f{background:#1a1a1a;border:1px solid #333;padding:10px 18px;border-radius:100px;font-family:Arial;font-size:13px;white-space:nowrap;cursor:pointer}
.f.active{background:#a3ff12;color:#000;border-color:#a3ff12}
.container{max-width:1000px;margin:0 auto;padding:10px 15px 40px}
.match{background:#141414;border:2px solid #222;border-radius:20px;padding:18px;margin-bottom:14px}
.top{border-color:#a3ff12}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.league{font-family:Arial;font-size:10px;color:#a3ff12;letter-spacing:1px}
.badge{font-family:Arial;font-size:10px;background:#222;padding:5px 10px;border-radius:100px;color:#aaa}
.teams{font-size:clamp(18px,5vw,28px);line-height:1.1;display:flex;flex-direction:column}
.vs{font-size:11px;color:#555;margin:4px 0;font-family:Arial}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.s{background:#1e1e1e;border-radius:12px;padding:10px;text-align:center}
.s span{font-family:Arial;font-size:9px;color:#777;display:block}
.s b{font-size:15px;color:#fff}
.s b.green{color:#a3ff12}
.prono-main{background:#a3ff12;color:#000;padding:12px;border-radius:12px;text-align:center;font-size:18px;margin:12px 0}
.analyse{font-family:Arial;font-size:13px;color:#aaa;line-height:1.4;background:#0f0f0f;padding:12px;border-radius:12px;border-left:3px solid #a3ff12}
.conf-bar{height:4px;background:#222;border-radius:10px;margin-top:12px;overflow:hidden}
.conf-fill{height:100%;background:#a3ff12}
</style>
</head>
<body>

</div>

<div class="f" onclick="filterM('corner')">⚽ CORNERS (30)</div>

{league:"🇲🇽 LIGA MX 03:00",home:"America",away:"Chivas",type:"top",cornerM:9.2,corner:"Over 8.5",over:"Over 2.5",btts:"BTTS OUI",conf:81,analyse:"Clasico Mexique. America 6 corners domicile."},

{league:"🇲🇦 BOTOLA 20:00",home:"Wydad",away:"Raja",type:"top",cornerM:8.9,corner:"Over 8.5",over:"Over 1.5",btts:"BTTS OUI",conf:83,analyse:"Derby Casablanca. Ambiance folle. Corners."}
];

let current = allMatchs;
function render(list){
 const el=document.getElementById('list');
 el.innerHTML='';
 document.getElementById('count').innerText=list.length;
 list.forEach(m=>{
   el.innerHTML+=`
   <div class="match ${m.conf>=90?'top':''}">
     <div class="head"><div class="league">${m.league}</div><div class="badge">MOY ${m.cornerM} CORN</div></div>
     <div class="teams"><span>${m.home}</span><span class="vs">VS</span><span>${m.away}</span></div>
     <div class="stats">
       <div class="s"><span>CORNERS</span><b class="green">${m.corner}</b></div>
       <div class="s"><span>BUTS</span><b>${m.over}</b></div>
       <div class="s"><span>PRONO</span><b class="green">${m.btts}</b></div>
     </div>
     <div class="prono-main">✅ PARI PRINCIPAL: ${m.corner} + ${m.btts}</div>
     <div class="analyse">🧠 <b>ANALYSE IA:</b> ${m.analyse}</div>
     <div class="conf-bar"><div class="conf-fill" style="width:${m.conf}%"></div></div>
     <div style="font-family:Arial;font-size:10px;color:#666;margin-top:6px">CONFIANCE IA: ${m.conf}% • xG: ${(m.conf/30).toFixed(1)}</div>
   </div>`;
 });
}
function filterM(t){
 document.querySelectorAll('.f').forEach(f=>f.classList.remove('active'));
 event.target.classList.add('active');
 if(t==='all') current=allMatchs;
 else current=allMatchs.filter(m=>m.type.includes(t));
 render(current);
}
render(allMatchs);
</script>
</body>
</html>
